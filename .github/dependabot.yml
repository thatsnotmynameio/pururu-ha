# The Home Assistant pin (pytest-homeassistant-custom-component), ruff and mypy
# move together with fetch_hassfest.py's VERSION, so they are bumped by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The docs.page CLI of the Docs workflow (package.json, pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
