# docs.page's own check of the docs site (docs.json and docs/**/*.mdx): broken
# internal links, missing pages, invalid MDX. The CLI's version and every
# package under it are pinned by package-lock.json's integrity hashes; npm ci
# fails if the lock is out of date.
name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: docs.page check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: nothing the check needs runs at install
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
