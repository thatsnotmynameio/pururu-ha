# The integration's tests and core's checks (ruff, format, mypy, hassfest,
# quality scale) at the Home Assistant version pyproject.toml pins, then
# SonarQube Cloud's analysis with the tests' coverage report. On main, Release
# runs it before publishing.
name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      # The manifest's version is MAJOR.MINOR.PATCH and not below the latest release
      - run: python3 release.py check
      # hassfest from HA's source archive (~29 MB), keyed on the pinned version and sha256
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hassfest
          key: hassfest-${{ hashFiles('fetch_hassfest.py') }}
      # --locked: fail if uv.lock is out of date (every package pinned by hash). Not
      # --no-build: mock-open, a dependency of the HA test plugin, ships only as sdist.
      - run: uv run --locked pytest --cov --cov-report=xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
