name: Claude Code Review

# Claude reviews the pull request and posts the review itself, as github-actions[bot].
# Public repo: it reads only its own comments and the owner's replies, can't read the process
# environment (/proc, git diff --no-index), and holds a token that can't push, tag or release.
# How: .claude/review/review.md, which the action restores from the base branch.
# Spec: docs/superpowers/specs/2026-09-29-claude-review-design.md
on:
  pull_request:
    # A full review when opened; a re-review (incremental) when labeled claude-review.
    # Add synchronize to review every push.
    types: [opened, reopened, ready_for_review, labeled]

concurrency:
  # One review at a time per PR; a waiting one reviews everything since the last.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review: # the check's name on PRs
    # Drafts only on the label; forks get no secret; the action refuses bot actors.
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review') &&
      (!github.event.pull_request.draft || github.event.action == 'labeled') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Claude posts with this job's token, never the Claude App's: in a public repo a prompt
    # injection must not be able to push, tag or release (the App token can).
    permissions:
      contents: read
      pull-requests: write # comments, review threads, the label
      issues: write # the summary comment

    steps:
      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head itself, not GitHub's test-merge commit: line numbers, suggestions and the
          # last reviewed commit must be the pull request's.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # Claude diffs against the last reviewed commit and the base

      - name: Review with Claude
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        env:
          # Subagents in the foreground: the action ends the session when the orchestrator yields
          # (anthropics/claude-code-action#1646).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: 1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }} # posts as github-actions[bot]
          prompt: >-
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}:
            base branch ${{ github.event.pull_request.base.ref }}, head commit ${{ github.event.pull_request.head.sha }}
            (checked out). Read .claude/review/review.md and follow it.
          claude_args: >-
            --model opus
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Agent,Task,Edit(//tmp/pururu-review/**),mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"
            --disallowedTools "NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//sys/**),Bash(git diff --no-index:*),Bash(git diff * --no-index:*)"

      - name: Remove the claude-review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/claude-review
