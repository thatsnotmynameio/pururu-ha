# The acceptance suite (acceptance/, its own uv project): a reference house in
# Home Assistant with pururu, seen from outside. It also reads docs/ (the coverage
# guard), the shipped translations and the root pyproject.toml and uv.lock (the
# pin check). CI calls it on pull requests that change the integration's code,
# docs/, the root Python project, acceptance/ or the workflows; on main, Release
# runs it before publishing. No trigger of its own besides a manual start.
name: Acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: acceptance/uv.lock
          cache-python: true
      # --locked: fail if acceptance/uv.lock is out of date (every package pinned by hash)
      - run: uv run --locked --project acceptance pytest acceptance
