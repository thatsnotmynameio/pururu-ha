config:
  notify: notify.mobile_app_phone
  events: [state_changed, reading]
  alerts:
    lights:
      groups:
        default: [device.biblioteca.lights.teto]
        externas: [device.biblioteca.lights.teto, device.biblioteca.lights.abajur]
      high: {turn_on: {color_name: red, effect: breathe}, repeat: "00:00:15"}
      resolved: {turn_on: {color_name: green}, lasts: {minutes: 2}}
floors:
  terreo: {name: Térreo, level: 0}
areas:
  despensa: {name: Despensa, floor: terreo}
  entrada: {name: Entrada, floor: terreo}
devices:
  clothes_washer:
    name: Tanquinho
    area: despensa
    appliance:
      power: sensor.washer_plug_power
      energy: sensor.washer_plug_energy
      running_program:
        above: 4
        on_delay: {minutes: 1}
        off_delay: {minutes: 2}
        phases:
          warming:
            name: Aquecendo
            above: 1000
            statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
          wringing:
            name: Centrifugando
            above: 50
            below: 1000
            on_delay: {minutes: 3}
            statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
        other:
          statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
        statistics:
          runtime: [today, week, month, year]
          cycles: [today, week, month, year]
      programs:
        detected:
          cotton:
            name: Algodão
            above: 1500
            on_delay: {minutes: 5}
            statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
            phases:
              warming:
                name: Aquecendo
                above: 1800
                statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
            other:
              statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
      statistics:
        idle_energy: [today, week, month, year]
      alerts:
        offline:
        no_power:
        long_cycle: {for: {hours: 3}, lights: default}
        no_cycle: {for: {days: 2}}
      notifications:
        finished:
    alerts:
      stuck:
        name: Travada
        when: appliance.running_program.phase_current
        state: wringing
        for: {hours: 1}
        priority: medium
        lights: externas
        message: Travada!
        done_message: Destravou.
      overload: {name: Sobrecarga, when: appliance.power, above: 2500, for: {minutes: 1}, priority: high}
  water_station:
    name: Purificador
    appliance:
      power: sensor.station_plug_power
      energy: sensor.station_plug_energy
      running_program:
        above: 2.9
        on_delay: {seconds: 1}
        off_delay: {minutes: 1}
        phases:
          resfriar:
            name: Resfriar
            above: 4
            below: 150
            on_delay: {seconds: 10}
            off_delay: {minutes: 3}
            statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
          quente:
            name: Água quente
            above: 150
            below: 400
            on_delay: {seconds: 30}
            off_delay: {seconds: 30}
            statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
        other:
          statistics: {runtime: [today, week, month, year], cycles: [today, week, month, year], energy: [today, week, month, year]}
  porta_frente:
    name: Porta da frente
    area: entrada
    door:
      contact: binary_sensor.porta_frente
      match: {seconds: 5}
      statistics:
        openings: [today, week, month, year]
        open_time: [today, week, month, year]
      event_entities:
        - entity: event.porta_frente_access
          types: {access_granted: opening, access_denied: denied}
          fields: {who: actor, how: authentication, direction: direction}
        - entity: event.porta_frente_doorbell
          types: {ring: ring}
      alerts:
        long_opening: {for: {minutes: 10}}
        no_opening: {for: {days: 1}}
  janela_quarto:
    name: Janela do quarto
    window:
      contact: binary_sensor.janela_quarto
      statistics:
        openings: [today, week, month, year]
        open_time: [today, week, month, year]
      alerts:
        long_opening: {for: {hours: 2}}
        no_opening: {for: {days: 2}}
  greenhouse:
    name: Estufa
    switches:
      sprinkler: {entity: switch.greenhouse_sprinkler, name: Irrigador}
    buttons:
      clean: {entity: sensor.greenhouse_remote_action, state: 1_single, name: Limpar, program: clean}
      bell: {entity: sensor.greenhouse_remote_action, state: 2_single, name: Sino}
    programs:
      executable:
        clean:
          name: Limpar
          sequence:
            - turn_on: switches.sprinkler
            - delay: {hours: 2}
            - turn_off: switches.sprinkler
          statistics:
            runtime: [today, week, month, year]
            cycles: [today, week, month, year]
    reactions:
      morning:
        name: Manhã
        at: "08:00"
        then: clean
        retry: {times: 2, every: {hours: 1}}
        statistics: {triggered: [today, week, month, year]}
  biblioteca:
    name: Biblioteca
    lights:
      teto: {entity: light.biblioteca_teto, name: Teto}
      abajur: {entity: switch.sonoff_abajur, name: Abajur}
    reactions:
      washer_done:
        name: Lavadora terminou
        when: device.clothes_washer.appliance.running_program
        from: "on"
        to: "off"
      night: {name: Noite, at: "22:00", message: Hora de apagar as luzes.}
