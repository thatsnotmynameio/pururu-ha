[project]
name = "pururu"
version = "0"
description = "The pururu Home Assistant integration's tests and tools (custom_components/pururu)"
requires-python = ">=3.14.2"
dependencies = [
    # Pins Home Assistant itself (0.13.366 -> homeassistant==2026.9.3)
    "pytest-homeassistant-custom-component==0.13.366",
    # What core pins at that tag (requirements_test_pre_commit.txt, requirements_test.txt)
    "ruff==0.16.3",
    "mypy==2.3.1",
    # hassfest's device_classes.py imports every core platform unconditionally, including
    # homeassistant.components.infrared, whose manifest requires this at that pinned tag
    "infrared-protocols==9.0.0",
    # Coverage for SonarQube Cloud (already a dependency of the HA test plugin)
    "pytest-cov",
]

[tool.uv]
package = false
# Dependabot alerts 1-4 (cryptography < 50, PyJWT < 2.14), in this dev/test environment only:
# homeassistant==2026.9.3 pins cryptography==48.0.1, PyJWT==2.13.0 and pyOpenSSL==26.2.0
# (which caps cryptography < 49). Remove once the pinned Home Assistant allows the fixed versions.
override-dependencies = [
    "cryptography>=50.0.0",
    "pyjwt>=2.14.0",
    "pyopenssl>=26.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = [".", "tests", "tools/dispatcher", ".github/scripts"]
asyncio_mode = "auto"
# The tests that read docs/ (tests/docs/) run apart: uv run pytest -m docs
addopts = "-n 4 --dist loadfile --import-mode=importlib -m \"not docs\""
markers = ["docs: a test that reads docs/ (tests/docs/), run by uv run pytest -m docs"]

[tool.coverage.run]
# The integration only; relative paths, as SonarQube Cloud reads them
source = ["custom_components/pururu"]
relative_files = true
