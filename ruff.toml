# Core's ruff settings at the pinned HA (home-assistant/core 2026.9.3, pyproject.toml),
# for custom_components/pururu. Paths are relative to where ruff runs: the project root.
required-version = ">=0.16.3"
target-version = "py314"

[lint]
select = [
  "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011", "E", "F",
  "F541", "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "LOG", "N804", "N805", "N806",
  "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "S107",
  "S102", "S103", "S108", "S301", "S306", "S307", "S313", "S314", "S315", "S316", "S317",
  "S318", "S319", "S601", "S602", "S604", "S608", "S609", "SIM", "SLF", "SLOT", "T100",
  "T20", "TC", "TID", "TRY", "UP", "UP031", "UP032", "W",
]
ignore = [
  "ASYNC109", "ASYNC110", "ASYNC240", "B008", "B019", "D202", "D203", "D213", "D406",
  "D407", "D417", "E501", "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  "PLR2004", "PLW0108", "PLW1641", "PLW2901", "PT011", "PT018", "RUF001", "RUF012",
  "RUF015", "RUF043", "SIM102", "SIM103", "SIM108", "SIM115", "TC001", "TC002", "TC003",
  "TC006", "TRY003", "TRY400", "UP047", "UP049",
  # May conflict with the formatter
  "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812", "COM819",
  # Ruff does not understand __all__ generated by a function
  "PLE0605",
]

[lint.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
"homeassistant.util.dt" = "dt_util"

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"__future__.annotations".msg = "It should not be needed because Home Assistant requires Python 3.14+"

[lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[lint.per-file-ignores]
# Relative imports from a parent package inside the integration's sub-packages, as core allows
"custom_components/*/*/**" = ["TID252"]

[lint.mccabe]
max-complexity = 25

[lint.pydocstyle]
convention = "google"
