# crew's workflow for this repository: what tools/dispatcher does today.
# crew: https://github.com/thatsnotmynameio/crew (docs/guide/crew.mdx).
config:
  poll_interval_seconds: 300
  max_parallel_issues: 2
  harness: claude
  model: claude-opus-5-5
tracker:
  name: github
  labels:
    ready: ready
    in_progress: in progress
    ready_to_review: ready to review
    in_review: in review
    needs_attention: needs attention
    paused: paused
    ready_to_merge: ready to merge
    done: done
workflow:
  - name: implement
    label: ready
    moves_to: in_progress
    on_success: in_review
    actions:
      - name: lfg
        prompt: |-
          /compound-engineering:lfg {{.Issue.Ref}}

          The pull request body must contain the line `Closes {{.Issue.Ref}}`, so merging it closes the issue.
