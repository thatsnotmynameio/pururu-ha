sonar.projectKey=thatsnotmynameio_pururu-ha
sonar.organization=thatsnotmynameio

sonar.sources=custom_components
sonar.tests=tests
sonar.python.version=3.14
# Written by `pytest --cov --cov-report=xml` in the Build workflow
sonar.python.coverage.reportPaths=coverage.xml

# The platform set-up functions have the signature Home Assistant requires:
# `async def async_setup_entry(hass, entry, async_add_entities)`, awaited by HA
# even when nothing inside awaits, with `hass` unused.
sonar.issue.ignore.multicriteria=unused_hass,async_setup,async_remove,refused_name,uv_build
sonar.issue.ignore.multicriteria.unused_hass.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.unused_hass.resourceKey=custom_components/pururu/*sensor.py
sonar.issue.ignore.multicriteria.async_setup.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.async_setup.resourceKey=custom_components/pururu/*sensor.py
# The same for `async def async_remove_entry(hass, entry)`, which HA awaits too
# (config_entries.py) while the registries it calls are synchronous.
sonar.issue.ignore.multicriteria.async_remove.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.async_remove.resourceKey=custom_components/pururu/__init__.py

# A floor or area name HA refuses (ValueError: already in use) is a configuration
# error, logged with _LOGGER.error and no traceback, which would be noise; core
# ignores the same rule in ruff (TRY400, ruff.toml).
sonar.issue.ignore.multicriteria.refused_name.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.refused_name.resourceKey=custom_components/pururu/places.py

# `uv run` without --no-build: mock-open (a dependency of the HA test plugin) is
# published only as an sdist, so it must be built; uv.lock pins it by hash and
# --locked refuses anything else.
sonar.issue.ignore.multicriteria.uv_build.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.uv_build.resourceKey=.github/workflows/build.yml
