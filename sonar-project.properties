sonar.projectKey=thatsnotmynameio_pururu-ha
sonar.organization=thatsnotmynameio

sonar.sources=custom_components
sonar.tests=tests
sonar.python.version=3.14
# Written by `pytest --cov --cov-report=xml` in the Build workflow
sonar.python.coverage.reportPaths=coverage.xml

# The platform set-up functions have the signature Home Assistant requires:
# `async def async_setup_entry(hass, entry, async_add_entities)`, awaited by HA
# even when nothing inside awaits, with `hass` unused. A pattern takes no {a,b}:
# the sensor platforms share one, switch.py, light.py and button.py have their own.
sonar.issue.ignore.multicriteria=unused_hass,async_setup,unused_hass_switch,async_setup_switch,unused_hass_light,async_setup_light,unused_hass_button,async_setup_button,async_remove,refused_name,reactions_failure,files_failure,alert2_failure,uv_build
sonar.issue.ignore.multicriteria.unused_hass.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.unused_hass.resourceKey=custom_components/pururu/*sensor.py
sonar.issue.ignore.multicriteria.async_setup.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.async_setup.resourceKey=custom_components/pururu/*sensor.py
sonar.issue.ignore.multicriteria.unused_hass_switch.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.unused_hass_switch.resourceKey=custom_components/pururu/switch.py
sonar.issue.ignore.multicriteria.async_setup_switch.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.async_setup_switch.resourceKey=custom_components/pururu/switch.py
sonar.issue.ignore.multicriteria.unused_hass_light.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.unused_hass_light.resourceKey=custom_components/pururu/light.py
sonar.issue.ignore.multicriteria.async_setup_light.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.async_setup_light.resourceKey=custom_components/pururu/light.py
sonar.issue.ignore.multicriteria.unused_hass_button.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.unused_hass_button.resourceKey=custom_components/pururu/button.py
sonar.issue.ignore.multicriteria.async_setup_button.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.async_setup_button.resourceKey=custom_components/pururu/button.py
# The same for `async def async_remove_entry(hass, entry)`, which HA awaits too
# (config_entries.py) while the registries it calls are synchronous.
sonar.issue.ignore.multicriteria.async_remove.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.async_remove.resourceKey=custom_components/pururu/__init__.py

# A floor or area name HA refuses (ValueError: already in use) is a configuration
# error, logged with _LOGGER.error and no traceback, which would be noise; core
# ignores the same rule in ruff (TRY400, ruff.toml).
sonar.issue.ignore.multicriteria.refused_name.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.refused_name.resourceKey=custom_components/pururu/places.py

# The same for automations that can't be reloaded (HomeAssistantError): an
# expected condition the message explains, logged with _LOGGER.error; a traceback
# would be noise.
sonar.issue.ignore.multicriteria.reactions_failure.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.reactions_failure.resourceKey=custom_components/pururu/reactions.py
# The same for a generated file (reactions' automations, Alert2's alerts) that
# can't be written: OSError (permissions, a full disk) or HomeAssistantError.
sonar.issue.ignore.multicriteria.files_failure.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.files_failure.resourceKey=custom_components/pururu/files.py
# The same for Alert2 that can't be reloaded with a HomeAssistantError (its
# service missing, its own refusal). Anything else Alert2 raises is its bug and
# goes to _LOGGER.exception, with the traceback.
sonar.issue.ignore.multicriteria.alert2_failure.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.alert2_failure.resourceKey=custom_components/pururu/alert2_alerts.py

# `uv run` without --no-build: mock-open (a dependency of the HA test plugin) is
# published only as an sdist, so it must be built; uv.lock pins it by hash and
# --locked refuses anything else.
sonar.issue.ignore.multicriteria.uv_build.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.uv_build.resourceKey=.github/workflows/build.yml
