[project]
name = "pururu-acceptance"
version = "0"
description = "pururu's acceptance suite: a reference house in Home Assistant, seen from outside"
requires-python = ">=3.14.2"
dependencies = [
    # The root project's pin (test_boundary.py fails when the two Home Assistants differ)
    "pytest-homeassistant-custom-component==0.13.366",
]

[tool.uv]
package = false
# The root project's overrides, for the same Dependabot alerts (see its pyproject.toml)
override-dependencies = [
    "cryptography>=50.0.0",
    "pyjwt>=2.14.0",
    "pyopenssl>=26.4.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
# "..": the repo root, so `custom_components` is the repo's folder (it has no __init__.py)
pythonpath = [".", ".."]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
